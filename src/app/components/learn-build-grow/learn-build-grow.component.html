<section class="lbg-section section-dark section" aria-labelledby="lbg-title">
  <div class="container">
    <div class="section-header animate-on-scroll">
      <span class="section-eyebrow" style="color: var(--blue-400);">The Hasura Journey</span>
      <h2 class="section-title" id="lbg-title" style="color: var(--white);">
        Learn → Build → <span class="text-gradient">Grow.</span>
      </h2>
      <p class="section-subtitle" style="color: rgba(255,255,255,0.55);">
        The signature Hasura methodology that transforms beginners and professionals alike into industry-ready technology talent.
      </p>
    </div>

    <div class="lbg-stages">
      <article class="lbg-stage animate-on-scroll" *ngFor="let stage of stages; let i = index; let last = last" [class]="'animate-delay-' + (i + 1) + ' lbg-stage--' + stage.color">
        <!-- Step indicator -->
        <div class="lbg-stage__step">
          <span>{{ '0' + (i + 1) }}</span>
        </div>

        <!-- Icon -->
        <div class="lbg-stage__icon" [class]="'lbg-stage__icon--' + stage.color">
          <ng-container *ngIf="stage.icon === 'book'">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
          </ng-container>
          <ng-container *ngIf="stage.icon === 'code'">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </ng-container>
          <ng-container *ngIf="stage.icon === 'rocket'">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 00-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 012-3.95A12.88 12.88 0 0122 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 01-4 2z"/></svg>
          </ng-container>
        </div>

        <h3 class="lbg-stage__title">{{ stage.step }}</h3>
        <h4 class="lbg-stage__subtitle">{{ stage.title }}</h4>
        <p class="lbg-stage__desc">{{ stage.description }}</p>

        <ul class="lbg-stage__points" aria-label="Key points">
          <li *ngFor="let point of stage.points">
            <div class="lbg-check" aria-hidden="true">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            {{ point }}
          </li>
        </ul>

        <!-- Arrow connector (not last) -->
        <div class="lbg-arrow" *ngIf="!last" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </div>
      </article>
    </div>

    <div class="lbg-cta text-center animate-on-scroll">
      <a routerLink="/courses" class="btn btn-primary btn-lg">Start Your Journey</a>
    </div>
  </div>
</section>
