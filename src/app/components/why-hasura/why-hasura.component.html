<section class="why-section section" aria-labelledby="why-title">
  <div class="container">
    <div class="section-header animate-on-scroll">
      <span class="section-eyebrow">Why Choose Hasura</span>
      <h2 class="section-title" id="why-title">
        Why <span class="text-gradient">Hasura?</span>
      </h2>
      <p class="section-subtitle">
        We're not another tech company. Here's what makes Hasura genuinely different.
      </p>
    </div>

    <div class="why-grid">
      <article class="why-card animate-on-scroll" *ngFor="let reason of reasons; let i = index" [class]="'animate-delay-' + ((i % 3) + 1)">
        <div class="why-card__header">
          <span class="why-card__number">{{ reason.number }}</span>

          <!-- Icons -->
          <div class="why-card__icon">
            <ng-container *ngIf="reason.icon === 'target'">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            </ng-container>
            <ng-container *ngIf="reason.icon === 'code'">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </ng-container>
            <ng-container *ngIf="reason.icon === 'zap'">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </ng-container>
            <ng-container *ngIf="reason.icon === 'users'">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
            </ng-container>
            <ng-container *ngIf="reason.icon === 'briefcase'">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
            </ng-container>
            <ng-container *ngIf="reason.icon === 'shield'">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </ng-container>
          </div>
        </div>

        <h3 class="why-card__title">{{ reason.title }}</h3>
        <p class="why-card__desc">{{ reason.description }}</p>
      </article>
    </div>
  </div>
</section>
