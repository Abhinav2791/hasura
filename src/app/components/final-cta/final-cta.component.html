<section class="final-cta section-dark" aria-labelledby="cta-title">
  <!-- Background geometry -->
  <div class="final-cta__bg" aria-hidden="true">
    <div class="cta-orb cta-orb--1"></div>
    <div class="cta-orb cta-orb--2"></div>
    <div class="cta-grid"></div>
    <!-- Geometric shapes -->
    <svg class="cta-geo cta-geo--1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <polygon points="100,10 190,55 190,145 100,190 10,145 10,55" fill="none" stroke="rgba(59,130,246,0.06)" stroke-width="1"/>
      <polygon points="100,30 170,65 170,135 100,170 30,135 30,65" fill="none" stroke="rgba(124,58,237,0.05)" stroke-width="1"/>
    </svg>
    <svg class="cta-geo cta-geo--2" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <polygon points="100,10 190,55 190,145 100,190 10,145 10,55" fill="none" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
    </svg>
  </div>

  <div class="container">
    <div class="final-cta__content animate-on-scroll">
      <div class="final-cta__eyebrow">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="cta-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#3B82F6"/>
              <stop offset="100%" style="stop-color:#7C3AED"/>
            </linearGradient>
          </defs>
          <polygon points="16,2 30,10 30,22 16,30 2,22 2,10" fill="url(#cta-logo-grad)" opacity="0.2"/>
          <polygon points="16,6 27,12.5 27,21.5 16,26 5,21.5 5,12.5" fill="none" stroke="url(#cta-logo-grad)" stroke-width="1.5"/>
          <polygon points="16,11 22,14.5 22,19.5 16,23 10,19.5 10,14.5" fill="url(#cta-logo-grad)"/>
        </svg>
        HASURA
      </div>

      <h2 class="final-cta__headline" id="cta-title">
        Have an Idea<br>
        <span class="text-gradient">Worth Building?</span>
      </h2>

      <p class="final-cta__sub animate-on-scroll animate-delay-1">
        Let's turn your vision into technology that creates real impact. Whether you want to build a product, learn a skill, or grow your career — Hasura is ready.
      </p>

      <div class="final-cta__actions animate-on-scroll animate-delay-2">
        <a routerLink="/contact" class="btn btn-primary btn-lg">
          Start a Conversation
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
        <a routerLink="/about" class="btn btn-secondary btn-lg">
          Explore Hasura
        </a>
      </div>

      <p class="final-cta__tagline animate-on-scroll animate-delay-3">DREAM • BUILD • GROW</p>
    </div>
  </div>
</section>
